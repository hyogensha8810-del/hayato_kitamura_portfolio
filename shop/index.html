<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP | HAYATO KITAMURA</title>
<meta name="description" content="HAYATO KITAMURA の写真プリント・油絵風ポスターの販売。全国送料無料。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<main class="shop-page shop-body">

  <div class="shop-filters">
    <button class="on" data-f="all">すべて</button>
    <button data-f="photo">写真プリント</button>
    <button data-f="oil">油絵風ポスター</button>
    <button data-f="framed">1点もの・額付き</button>
  </div>

  <div class="shop-masonry" id="shopGrid"></div>

</main>

<script src="shop-data.js"></script>
