/* ============ GitHub API ============ */
function gh(path, opts) {
  var c = cfg();
  opts = opts || {};
  opts.headers = Object.assign({
    'Authorization': 'Bearer ' + c.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  }, opts.headers || {});
  return fetch('https://api.github.com/repos/' + c.owner + '/' + c.repo + path, opts)
    .then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
        return j;
      });
    });
}
function getSha(path) {
  var c = cfg();
  return gh('/contents/' + path + '?ref=' + c.branch)
    .then(function (j) { return j.sha; })
    .catch(function () { return null; });
}
function putFile(path, b64, message) {
  var c = cfg();
  return getSha(path).then(function (sha) {
    var body = { message: message, content: b64, branch: c.branch };
    if (sha) body.sha = sha;
    return gh('/contents/' + path, { method: 'PUT', body: JSON.stringify(body) });
  });
}
function utf8b64(str) {
  return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str)));
}

/* ============ 画像のリサイズ ============ */
function resizeToBlob(file, max) {
  return new Promise(function (res, rej) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * s); cv.height = Math.round(h * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(function (b) { b ? res(b) : rej(new Error('画像を変換できませんでした')); }, 'image/jpeg', 0.86);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
function blobToB64(blob) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function slug(s) {
  return (s || 'work').replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'work';
}

/* ============ 使っていない画像の整理 ============ */
function cstatus(msg, kind) {
  var s = el('cleanStatus'); if (!s) return;
  s.className = 'adm-status ' + (kind || 'busy'); s.innerHTML = msg;
}
function usedPaths() {
  var used = {};
  D.products.forEach(function (p) {
    (p.images || []).forEach(function (im) { used[String(im).replace(/^\.\.\//, '')] = true; });
  });
  return used;
}
/* 複数ファイルの削除を「1つのコミット」にまとめる（GitHubのGit Data APIを使用） */
function bulkDelete(paths, message) {
  var c = cfg(), head, treeSha;
  return gh('/git/ref/heads/' + c.branch)
    .then(function (r) { head = r.object.sha; return gh('/git/commits/' + head); })
    .then(function (cm) {
      treeSha = cm.tree.sha;
      return gh('/git/trees', { method: 'POST', body: JSON.stringify({
        base_tree: treeSha,
        tree: paths.map(function (p) { return { path: p, mode: '100644', type: 'blob', sha: null }; })
      })});
    })
    .then(function (t) {
      return gh('/git/commits', { method: 'POST', body: JSON.stringify({
        message: message, tree: t.sha, parents: [head] })});
    })
    .then(function (nc) {
      return gh('/git/refs/heads/' + c.branch, { method: 'PATCH', body: JSON.stringify({ sha: nc.sha }) });
    });
}
function bindCleanup() {
  el('c_scan').onclick = function () {
    cstatus('画像を確認しています…', 'busy');
    el('cleanList').innerHTML = '';
    gh('/contents/' + IMG_DIR + '?ref=' + cfg().branch).then(function (files) {
      var used = usedPaths();
      var unused = files.filter(function (f) {
        return f.type === 'file' && !used[IMG_DIR + '/' + f.name];
      });
      var inUse = files.length - unused.length;
      if (!unused.length) {
        cstatus('使っていない画像はありませんでした。（' + inUse + '枚すべてが使用中です）', 'ok');
        return;
      }
      cstatus('使用中 ' + inUse + '枚 ／ <b style="color:var(--accent);font-weight:400">使っていない画像 ' + unused.length + '枚</b>', 'ok');
      el('cleanList').innerHTML =
        '<div style="max-height:200px;overflow:auto;border:1px solid rgba(232,226,217,.12);padding:12px 14px;margin-top:14px;font-size:.72rem;line-height:1.9;color:var(--text-dim)">' +
        unused.map(function (f) { return esc(f.name); }).join('<br>') + '</div>' +
        '<div class="adm-btns"><button class="btn-gold" id="c_del">この' + unused.length + '枚を削除する</button>' +
        '<span class="adm-note">1回のコミットでまとめて削除します。取り消したい場合はGitHubの履歴から戻せます。</span></div>';
      el('c_del').onclick = function () {
        if (!confirm('使っていない画像 ' + unused.length + '枚を削除します。よろしいですか？')) return;
        el('c_del').disabled = true;
        cstatus('削除しています…', 'busy');
        bulkDelete(unused.map(function (f) { return IMG_DIR + '/' + f.name; }),
                   'shop: 使っていない画像 ' + unused.length + '枚を削除')
          .then(function () {
            cstatus(unused.length + '枚を削除しました。<br>サイトへの反映まで1分ほどかかります。', 'ok');
            el('cleanList').innerHTML = '';
          })
          .catch(function (e) { cstatus('削除に失敗しました：' + esc(e.message), 'ng'); el('c_del').disabled = false; });
      };
    }).catch(function (e) { cstatus('画像の一覧を取得できませんでした：' + esc(e.message), 'ng'); });
  };
}

    D.products.push({ id: id, title: '新しい作品', type: 'photo', kind: 'print',
      place: '', year: String(new Date().getFullYear()), status: 'draft', desc: '',

      prices: { postcard: 1800, a5: 2500, a4: 3800, a3: 7500, a2: 11000, a1: 16500 } });

    status('新しい作品を追加しました。内容を入力して保存してください。', 'ok');
  };
}

  function collectForm() {
    if (!el('a_title')) return;
    p.title = el('a_title').value.trim() || p.title;
    p.place = el('a_place').value.trim();
    p.year  = el('a_year').value.trim();
    p.desc  = el('a_desc').value;
    p.status = el('a_status').value;
    var k = el('a_kind').value;
    if (k === 'framed') {
      p.kind = 'framed'; p.type = 'photo';
      if (el('a_fixed'))  p.fixedSize = el('a_fixed').value;
      if (el('a_fprice')) p.framedPrice = +el('a_fprice').value || 0;
      if (el('a_stock'))  p.stock = +el('a_stock').value;
      if (!p.fixedSize) p.fixedSize = 'a2';
      if (p.stock == null) p.stock = 1;
      /* prices は消さずに残す。種別を写真に戻したとき価格が復活します */
    } else {
      p.kind = 'print'; p.type = k;
      if (!p.prices) p.prices = { postcard: null, a5: null, a4: null, a3: null, a2: null, a1: null };
      qsa('#admPanel [data-price]').forEach(function (i) {
        var v = i.value.trim(); p.prices[i.dataset.price] = v ? +v : null;
      });
      /* framed 用の項目も消さずに残す（額付きに戻したとき復活します） */
    }
  }

  /* 入力するそばからデータに反映しておく（不意の消失を防ぐ） */
  qsa('#admPanel input, #admPanel textarea, #admPanel select').forEach(function (i) {
    if (i.type === 'file') return;
    i.addEventListener('input', function () { collectForm(); dirty = true; });
  });

  /* 種別を切り替えたら、その場で入力欄を作り直す */
  el('a_kind').addEventListener('change', function () {
    collectForm(); dirty = true; drawPanel();
  });

  /* 作品を切り替えるときにも内容を保持できるよう、外から呼べるようにしておく */
  pendingCollect = collectForm;

  /* 画像アップロード */
  qsa('#admPanel input[type=file]').forEach(function (inp) {
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      collectForm();
      var slot = inp.dataset.slot;
      var name = slug(p.id) + '-' + (slot === 'new' ? p.images.length + 1 : (+slot === 0 ? 'main' : 'sub' + slot)) + '-' + Date.now().toString(36) + '.jpg';
      status('画像を縮小してアップロードしています…', 'busy');
      resizeToBlob(f, 1800).then(blobToB64).then(function (b64) {
        return putFile(IMG_DIR + '/' + name, b64, 'shop: 画像アップロード ' + name);
      }).then(function () {
        var path = '../' + IMG_DIR + '/' + name;
        if (slot === 'new') p.images.push(path); else p.images[+slot] = path;
        dirty = true;
        status('画像をアップロードしました。<b style="color:var(--accent);font-weight:400">まだ商品には反映されていません</b> — 「保存してサイトに反映」を押してください。', 'ok');
        drawPanel();
      }).catch(function (e) { status('アップロードに失敗しました：' + esc(e.message), 'ng'); });
    };
  });
  qsa('#admPanel [data-del]').forEach(function (b) {
    b.onclick = function () { collectForm(); p.images.splice(+b.dataset.del, 1); dirty = true; drawPanel(); };
  });

  /* 保存 */
  el('a_save').onclick = function () {
    collectForm();
    status('保存しています…', 'busy');
    putFile(DATA_PATH, utf8b64(serialize()), 'shop: ' + p.title + ' を更新')
      .then(function () {
        dirty = false;
        status('保存しました。GitHubへ反映済みです。<br>実際のページに出るまで1分ほどかかります（GitHub Pagesの反映待ち）。<br>' +
               '<a href="index.html" style="color:var(--accent)">一覧を見る →</a>', 'ok');
        drawList();
      })
      .catch(function (e) { status('保存に失敗しました：' + esc(e.message), 'ng'); });
  };

  el('a_json').onclick = function () {
    var t = el('a_jsonout'); t.style.display = 'block'; t.value = serialize();
  };
  el('a_del').onclick = function () {
    if (!confirm('「' + p.title + '」を削除します。よろしいですか？')) return;
    D.products = D.products.filter(function (x) { return x.id !== sel; });
    sel = null;
    status('削除しています…', 'busy');
    putFile(DATA_PATH, utf8b64(serialize()), 'shop: 作品を削除')
      .then(function () { drawList(); drawPanel(); status('削除しました。', 'ok'); })
      .catch(function (e) { status('削除に失敗しました：' + esc(e.message), 'ng'); });
  };
  el('a_logout').onclick = function () {
    if (!confirm('この端末に保存されているGitHubトークンを削除します。よろしいですか？')) return;
    localStorage.removeItem(CFG_KEY); location.reload();
  };
}

window.addEventListener('beforeunload', function (e) {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* 起動 */
if (cfg().token) main(); else { U.chrome('Shop'); gate(); }
})();
</script>
</body>
</html>
