  <h1 class="page-title">CONTACT</h1>
  <p class="page-title-jp">撮影のご相談・お問い合わせ</p>

  <p class="dim">メニュー撮影・ブランディング撮影のご相談は、下記フォームよりお気軽にお問い合わせください。<br>
  内容を確認のうえ、hyogensha8810@gmail.com よりご返信いたします。</p>

  <!-- ▼▼▼ Formspree設定 ▼▼▼
       1. https://formspree.io で無料アカウントを作成（hyogensha8810@gmail.com）
       2. New Form → 送信先メールを設定 → 発行されるフォームID（例: xabcdefg）を取得
       3. 下の action の「YOUR_FORM_ID」を差し替える
       ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ -->
  <form class="contact-form" action="https://formspree.io/f/mojgejdv" method="POST">
    <label for="name">お名前 / 店舗名</label>
    <input type="text" id="name" name="name" required>

    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="email" required>

    <label for="message">お問い合わせ内容</label>
    <textarea id="message" name="message" required placeholder="撮影のご希望内容、店舗の業態、ご予算感など"></textarea>

    <button type="submit">送信する</button>
  </form>

  <p class="contact-note">フォームがご利用いただけない場合は <a href="mailto:hyogensha8810@gmail.com" style="color:var(--accent)">hyogensha8810@gmail.com</a> まで直接ご連絡ください。</p>
