# ================================================================
#  リンク台帳 (アキ管理)
# ================================================================
#  記事本文には生URLを書かない。必ず {{link:ID}} で参照する。
#  ASPが変わっても、このファイルの1行を直せば全記事が直る。
#
#  status:
#    active        通常稼働
#    price_changed 価格が変わった（本文の記述要確認）
#    discontinued  廃番
#    asp_ended     ASP案件終了 → alternative へ差し替える
#
#  url が空の場合は「準備中」表示になる。
#  ASP承認前でも記事を先に書けるようにするための仕組み。
# ================================================================

